<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>두근두근 데이터 파이프라인</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 큰 루프(나를 알고 → 꿈을 찾고 → 나아가고 → 더 나은 내가 되기)가 지도 테두리를 돌고, 그 안에 학생 · 선생님 · 두근두근 시스템 세 구역, 구역마다 작은 루프(단계가 보이는 노선)과 노선 사이 연결선. 휴대폰은 세로 카드. */
:root{
  --paper:#f6efe0; --card:#fffaf0; --ink:#2a2118; --sub:#5c4f40; --rule:#e2d4b8; --grid:#eee3cb;
  --stu:#d63a50; --stu-bg:#fbe4da;
  --tea:#13865a; --tea-bg:#e2eed0;
  --sys:#5443c6; --sys-bg:#ebe3f4;
  --sep:#6b5a48; --sep-bg:#f1e7d3;
  --sea:#cfe9f3; --sea-deep:#a9d6e8; --shallow:#e4f5f8; --wave:#ffffff; --route:#c25e2a; --wood:#f6e7c8; --wood-ink:#7a4a24;
  --big:#e59a00; --big-soft:#ffe7b0;
  --hl:#fff3b0;
  --ai:#0aa6d1; --ai-bg:#cdf3ff; --ai-card:#ffffff; --ai-ink:#06627d; --ai-sub:#2f6273;
  --f-display:'Jua','Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  --f-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1220; --card:#171d30; --ink:#eef1fa; --sub:#aab3c8; --rule:#2a3350; --grid:#1a2136;
  --stu:#ff7a8a; --stu-bg:#2c1820; --tea:#36c98a; --tea-bg:#112619; --sys:#9a86ff; --sys-bg:#1d1a3a; --sep:#a4acbb; --sep-bg:#1b2030; --sea:#12304a; --sea-deep:#0d2538; --shallow:#1a3d57; --wave:#2b5878; --route:#ff9a5c; --wood:#3a2c1c; --wood-ink:#f3d6a8; --big:#ffc23d; --big-soft:#3d3214;
  --hl:#3b3413; --ai:#0aa6d1; --ai-bg:#bdefff; --ai-card:#f4fdff; --ai-ink:#06627d; --ai-sub:#2f6273; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0e1220; --card:#171d30; --ink:#eef1fa; --sub:#aab3c8; --rule:#2a3350; --grid:#1a2136;
  --stu:#ff7a8a; --stu-bg:#2c1820; --tea:#36c98a; --tea-bg:#112619; --sys:#9a86ff; --sys-bg:#1d1a3a; --sep:#a4acbb; --sep-bg:#1b2030; --sea:#12304a; --sea-deep:#0d2538; --shallow:#1a3d57; --wave:#2b5878; --route:#ff9a5c; --wood:#3a2c1c; --wood-ink:#f3d6a8; --big:#ffc23d; --big-soft:#3d3214;
  --hl:#3b3413; --ai:#0aa6d1; --ai-bg:#bdefff; --ai-card:#f4fdff; --ai-ink:#06627d; --ai-sub:#2f6273; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;position:relative}
.logo i{position:absolute;width:22px;height:22px;border-radius:50%;border:4px solid}
.logo i:nth-child(1){left:9px;top:0;border-color:var(--stu)} .logo i:nth-child(2){left:0;top:15px;border-color:var(--tea)} .logo i:nth-child(3){left:18px;top:15px;border-color:var(--sys)}
.brand b{font-family:var(--f-display);font-size:22px;font-weight:400}
.brand small{display:block;color:var(--sub);font-size:12px;margin-top:-4px}
.who{display:flex;gap:4px;background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:4px;align-items:center}
.who button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--sub);padding:7px 12px;border-radius:999px;cursor:pointer;min-height:36px}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:700}
.who-l{font-size:12px;color:var(--sub);margin:0 4px 0 8px}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:22px 0 14px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(27px,4vw,42px);line-height:1.18;margin:0;text-wrap:balance}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 0)}
.hero p{margin:8px 0 0;color:var(--sub);max-width:64ch}
.login{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.gbtn{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 18px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);min-height:48px}
.gbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.gbtn svg{width:20px;height:20px}
.login small{color:var(--sub);font-size:12px}
.me{display:none;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:8px 14px}
.me .av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-family:var(--f-display)}
body.in .gbtn{display:none} body.in .me{display:flex}
.quick{display:none;gap:8px;flex-wrap:wrap;margin:0 0 14px}
body.in .quick{display:flex}
.quick a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:8px 14px;font-weight:500;min-height:40px}
.quick a i{width:12px;height:12px;border-radius:50%}
.board{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.mapbox{background:transparent;border:0;padding:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mapbox{--card:#fffaf0;--ink:#2a2118;--sub:#5c4f40;--stu:#d63a50;--stu-bg:#fbe4da;--tea:#13865a;--tea-bg:#e2eed0;--sys:#5443c6;--sys-bg:#ebe3f4;--sep:#6b5a48;--sep-bg:#f1e7d3;--shallow:#e4f5f0;--route:#b0532a;--wood:#f6e7c8;--wood-ink:#7a4a24;--big:#d98a00;--big-soft:#ffe7b0;--hl:#fff3b0;--paper:#f6efe0}}
:root[data-theme="dark"] .mapbox{--card:#fffaf0;--ink:#2a2118;--sub:#5c4f40;--stu:#d63a50;--stu-bg:#fbe4da;--tea:#13865a;--tea-bg:#e2eed0;--sys:#5443c6;--sys-bg:#ebe3f4;--sep:#6b5a48;--sep-bg:#f1e7d3;--shallow:#e4f5f0;--route:#b0532a;--wood:#f6e7c8;--wood-ink:#7a4a24;--big:#d98a00;--big-soft:#ffe7b0;--hl:#fff3b0;--paper:#f6efe0}
.mapbox svg{display:block;width:100%;height:auto}
/* 지도 요소 */
.bigtrack{fill:none;stroke:#ffffff;stroke-width:28;opacity:.45}
.bigline{fill:none;stroke:#b5442c;stroke-width:5;stroke-linecap:round}
.link-l.big{stroke:#b5442c!important;stroke-width:5}
.link-l.plan{stroke-dasharray:6 7;opacity:.7}
.boat{fill:#fff8e6;stroke:#7a4a24;stroke-width:1.6}
.badge rect{fill:#7a4a24} .badge text{fill:#fff8e6;font-size:11.5px;font-weight:700}
.flag text{font-family:var(--f-display);font-size:14px;fill:#b5442c}
.lt{fill:none;stroke-width:2.4;stroke-linejoin:round}
.stage rect{fill:var(--wood);stroke:var(--wood-ink);stroke-width:3}
.stage text{font-family:var(--f-display);font-size:19px;fill:var(--wood-ink)}
.island-shoal{fill:#8fd0c9;opacity:.5}
.island-halo{fill:#f7e7b4;stroke:#7a4a24;stroke-width:2.4;stroke-linejoin:round}
.coast{fill:none;stroke-width:1.6;stroke-dasharray:3 6;opacity:.7}
.island{stroke:#7a4a24!important;stroke-width:2;stroke-linejoin:round}
.compass circle{fill:var(--wood);stroke:var(--wood-ink);stroke-width:2.5}
.compass path{fill:var(--route)} .compass text{font-size:13px;font-weight:700;fill:var(--wood-ink)}
.ship path{fill:var(--wood);stroke:var(--wood-ink);stroke-width:2}
.port-l{font-family:var(--f-display);font-size:18px;fill:var(--wood-ink)}
.zone rect.bg{stroke-width:2.5}
.zone.sep .bg{stroke-dasharray:10 8}
.sepnote{font-size:12.5px;fill:var(--sub)}
.zname{font-family:var(--f-display);font-size:25px}
.zsub{font-size:13px;fill:var(--sub)}
.cell{cursor:pointer;transition:opacity .2s}
.cell rect.box{fill:var(--card);stroke-width:2}
.cell .ttl{font-family:var(--f-display);font-size:17.5px;fill:var(--ink)}
.cell .app{font-size:11px;fill:var(--sub)}
.cell .rail{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.cell .dot{stroke-width:3.5}
.cell .stp{font-size:13px;font-weight:500;fill:var(--ink)}
.cell .stp.link{font-weight:700}
.cell .chip{font-size:10.5px;font-weight:700}
.cell:hover rect.box,.cell.sel rect.box{fill:var(--hl)}
.cell:focus{outline:none} .cell:focus-visible rect.box{stroke-width:4}
.link-l{fill:none;stroke-width:3;opacity:.8;transition:opacity .2s,stroke-width .2s}
body.focus .link-l:not(.on){opacity:.18}

.link-l.on{opacity:1;stroke-width:4.5}
body.focus .cell:not(.sel):not(.rel) :is(text,.rail,.dot,path){opacity:.38}
.hub rect{fill:var(--ink)} .hub text{fill:var(--paper);font-size:13px;font-weight:700}
.channel{fill:#ffffff;opacity:.55;stroke:var(--wood-ink);stroke-width:2;stroke-dasharray:2 7}
body.v-st .zone.tea,body.v-st .zone.sys{opacity:.55}
body.v-te .zone.stu{opacity:.55}
/* 패널 */
.panel{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.tag{display:inline-flex;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:10px 0 2px;line-height:1.2}
.panel .app{color:var(--sub);font-size:13px;margin:0 0 10px}
.panel h3{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:700}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:4px 0 4px 32px;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:var(--c)}
.steps.loop li.lend::after{content:"↻ 다시 처음으로";display:block;font-size:12px;color:var(--sub)}
.links{list-style:none;margin:0;padding:0;font-size:13.5px}
.links li{padding:6px 0;border-top:1px solid var(--rule)}
.links li:first-child{border-top:0}
.links b{font-weight:700}
.links .c{font-size:11.5px;color:var(--sub);display:block}
.links button{font:inherit;font-size:13.5px;background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px;margin:14px 0}
.kv dt{color:var(--sub)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.go{display:flex;gap:8px;flex-wrap:wrap}
.go a,.go span{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;font-weight:700;text-decoration:none}
.go a{background:var(--ink);color:var(--paper)}
.go span{border:1.5px dashed var(--rule);color:var(--sub);font-weight:500}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin:14px 2px 0;font-size:13px;color:var(--sub);align-items:center}
.legend svg{vertical-align:middle;margin-right:6px}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}
.rules div{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px 16px}
.rules b{font-family:var(--f-display);font-weight:400;font-size:18px;display:block;margin-bottom:4px}
.rules p,.rules .rl{margin:0;color:var(--sub);font-size:13.5px} .rules .rl{padding-left:1.1em} .rules .rl li{margin:2px 0}
.cast{margin-top:26px}
.cast h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 12px}
.cast-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.cast figure{margin:0;display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:10px 14px}
.cast img{width:64px;height:64px;object-fit:contain;flex:none}
.cast figcaption{min-width:0}
.cast b{font-family:var(--f-display);font-weight:400;font-size:18px} .cast small{color:var(--sub);font-size:12px;margin-left:6px}
.cast span{display:block;font-size:13.5px;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere} .rules .rl li,.proto{word-break:keep-all}
.hero-cast{display:flex;align-items:flex-end;gap:2px;margin-top:10px}
.hero-cast img{width:58px;height:58px;object-fit:contain}
.cards .lp img{width:34px;height:34px;object-fit:contain;vertical-align:middle;margin-right:6px}
.cards{display:none}
.proto{margin-top:20px;font-size:12px;color:var(--sub)}

/* 데이터 흐름(큰 항로 네 단계 × 담임 · 학생 · 탐험대 · 프로젝트 · 담당 교사) — 2026-11-23 */
.flow{margin-top:26px}
.flow h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0 0 4px}
.flow .fsub{margin:0 0 12px;color:var(--sub);max-width:72ch}
.flowbox{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px 10px;overflow-x:auto}
.flowbox svg{display:block;width:100%;min-width:660px;max-width:1000px;margin:0 auto}
.sparks .sg{filter:url(#fglow);fill-opacity:.85} .sparks .a{fill:var(--sys)} .sparks .g{fill:var(--big)} .sparks .sc{fill:#fff} .sparks .st1{fill-opacity:.7} .sparks .st2{fill-opacity:.4} 
@media (prefers-reduced-motion: reduce){ .sparks{display:none} }
.fswipe{display:none;margin:0 0 6px;font-size:13px;color:var(--sub);text-align:center}
@media (max-width:700px){.fswipe{display:block}}
.fl-h{font:400 17px var(--f-display);fill:var(--ink)} .fl-t{font:700 14px var(--f-body);fill:var(--ink)} .fl-s{font:400 12px var(--f-body);fill:var(--sub)}
.fl-l{font:700 14px var(--f-body);fill:var(--ink)} .fl-l.e{fill:var(--stu)} .fl-l.g{fill:var(--tea)}
.fb rect{stroke-width:1.2} .fb.p rect{fill:var(--card);stroke:var(--big)} .fb.e rect{fill:var(--stu-bg);stroke:var(--stu)} .fb.g rect{fill:var(--tea-bg);stroke:var(--tea)} .fb.x rect{fill:var(--ai-card);stroke:var(--ai);stroke-width:1.4} .fb.x .fl-t{fill:var(--ai-ink)} .fb.x .fl-s{fill:var(--ai-sub)}
.fa{stroke:var(--sys);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round} .fa.new{stroke-width:3.4} .fg{stroke:var(--big);stroke-width:2.6;stroke-dasharray:0.01 5.6;stroke-linecap:round;stroke-linejoin:round;fill:none} .flane{stroke:var(--rule);stroke-width:1} .flayer{fill:var(--ai-bg);stroke:var(--ai);stroke-width:1.6} .fhead{stroke:var(--sub);stroke-width:1;fill:none}

/* 지도 = 데이터 파이프라인 그림(2026-11-23 PD "이 그림이 제일 좋네요. 이걸 기반으로 지도 다시") */
.maphead{margin:18px 0 10px} .maphead h2{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0} .maphead p{margin:2px 0 0;color:var(--sub)}
.mapbox{background:var(--card);border:1px solid var(--rule);border-radius:22px;padding:14px 10px;overflow-x:auto}
.mapbox .pmap{display:block;width:100%;min-width:820px;height:auto}
.pbox,.hit{cursor:pointer} .pbox:hover rect,.pbox:focus rect{stroke-width:2.4} .pbox.sel rect{stroke-width:3.2} .pbox:focus,.hit:focus{outline:none}
.hit{fill:transparent} .hit:hover,.hit.sel{fill:rgba(10,166,209,.12)}
.others{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px} .others b{font-family:var(--f-display);font-weight:400;font-size:17px;margin-right:4px}
.others button{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;min-height:40px;font:500 14px var(--f-body);cursor:pointer}
.others button:hover{border-color:var(--big)}

/* 흐름 보기(2026-11-23 3-way: Codex gpt-6.2-astra · Gemini gemini-4-neon-high · 총괄) — 멈춘 채 시작, 누르면 일곱 차례, 한 바퀴 뒤 멈춤 */
.playbar{position:sticky;left:0;top:0;z-index:2;display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 10px;padding:10px 12px;border-radius:16px;background:var(--paper);border:1px solid var(--rule)}
.pl-main{border:0;border-radius:999px;padding:10px 18px;min-height:44px;background:var(--sys);color:#fff;font:700 15px var(--f-body);cursor:pointer}
.pl-main:focus-visible,.pl-ctl button:focus-visible{outline:3px solid var(--big);outline-offset:2px}
.pl-cap{flex:1 1 280px;margin:0;font:500 16px/1.45 var(--f-body);color:var(--ink);min-height:2.9em;display:flex;align-items:center}
.pl-ctl{display:flex;align-items:center;gap:6px}
.pl-ctl button{border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;min-width:44px;min-height:40px;padding:0 12px;font:600 14px var(--f-body);cursor:pointer}
.pl-ctl button:disabled{opacity:.4;cursor:default}
.pl-ctl span{min-width:44px;text-align:center;font:600 14px var(--f-body);color:var(--sub)}
.pmap .pbox,.pmap .arw,.pmap .alab,.pmap .flayer,.pmap .fb.x,.pmap .hit{transition:opacity .35s}
.pmap.playing .pbox:not(.on),.pmap.playing .arw:not(.on),.pmap.playing .alab:not(.on){opacity:.22}
.pmap.playing .flayer,.pmap.playing .fb.x{opacity:.35}
.pmap.playing .pbox.on rect{stroke-width:3}
.pmap.playing .fa.arw.on{stroke-width:2.6} .pmap.playing .fg.arw.on{stroke-width:3.2}
.pmap .bridge{stroke:var(--card);stroke-width:8;fill:none} .fb.n rect{fill:var(--card);stroke:var(--sub);stroke-dasharray:4 3} .pmap.playing .bridge{opacity:1}
.pmap .sparks path{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pmap .sparks .pipe{stroke-width:9;opacity:.26} .pmap .sparks .pipe.a{stroke:var(--sys)} .pmap .sparks .pipe.g{stroke:var(--big)}
.pmap .sparks .run{stroke:#fff;stroke-width:2.4;stroke-dasharray:2.5 11;opacity:0;transition:opacity .6s ease}
.pmap .sparks .run.go{opacity:.95;animation:pmflow .75s linear infinite}
@keyframes pmflow{from{stroke-dashoffset:13.5}to{stroke-dashoffset:0}}
@media (max-width:1000px){ .board{grid-template-columns:1fr} .panel{position:static} }
@media (max-width:680px){
  .hero{grid-template-columns:1fr} .login{align-items:stretch} .gbtn{justify-content:center}
  .cards{display:block} .rules{grid-template-columns:1fr} .who-l{display:none}
}
/* 휴대폰 카드 */
.big-m{background:var(--card);border:2px solid var(--big);border-radius:18px;padding:10px 14px;margin-bottom:12px;font-family:var(--f-display);font-size:17px;text-align:center}
.big-m span{color:var(--big)}
.cards .z{border-radius:20px;padding:14px;margin-bottom:12px;border:2px solid var(--c);background:var(--bgc)}
.cards h3{font-family:var(--f-display);font-weight:400;font-size:21px;margin:0;color:var(--c)}
.cards .zs{font-size:13px;color:var(--sub);margin:0 0 4px}
.cards .lp{display:block;width:100%;text-align:left;font:inherit;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin-top:10px;color:var(--ink);cursor:pointer}
.cards .lp b{font-family:var(--f-display);font-weight:400;font-size:17px}
.cards .lp small{color:var(--sub);font-size:12px;margin-left:6px}
.cards .lp ol{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:4px 0;font-size:13px}
.cards .lp li::after{content:"→";color:var(--c);margin:0 6px}
.cards .lp li:last-child::after{content:"";}
.cards .lp li.link{font-weight:700;text-decoration:underline;text-decoration-color:var(--c);text-underline-offset:3px}

.starband{position:relative;margin:-4px 0 12px;border-radius:14px;overflow:hidden;height:92px}
.starband img{width:100%;height:100%;object-fit:cover;display:block}
.starband span{position:absolute;left:12px;bottom:9px;color:#fff8e6;font-family:var(--f-display);font-size:16px;text-shadow:0 1px 4px #0008}

.pipe-hero{padding:28px 0 6px} .pipe-hero h1{margin:0 0 10px} .pipe-hero p{margin:0;max-width:760px;color:var(--sub)}
.pipe-wrap .mapbox{margin-top:8px}

<script>
const $=id=>document.getElementById(id);
// ── 흐름 보기: 일곱 차례(자막 · 켤 칸 · 켤 선). 처음엔 멈춤, 재생은 한 바퀴 뒤 멈춤, 칸을 누르면 멈춤 ──
const STEPS=[
 ['학생이 좋아하고 잘하는 활동을 적고, 추천 직업 가운데 꿈을 골라 꿈의 별자리를 그립니다.',['S1','S2'],['k1']],
 ['프로그램 담당 교사는 같은 때 한 해 프로그램을 설계하고 모집을 엽니다.',['P1','P3'],['k6']],
 ['담임 교사는 그 별자리와 열린 프로그램을 함께 보며 과목 선택까지 상담하고 활동을 권합니다. 학생이 수락한 권유만 반영됩니다.',['S2','P1','T2','S3'],['k2','k5','k4']],
 ['학생은 권유받거나 스스로 고른 해 볼 일로 모집 중인 프로그램에 바로 신청하고 결과를 받습니다.',['S2','S3','P3'],['k3','k11','k10']],
 ['프로그램 담당 교사는 그 프로그램이 끝나면 출석 · 결과 보고 · 학생 후기로 실제 참여를 확인합니다.',['P3','P4'],['k7']],
 ['생기부 담당 교사는 확인된 참여를 종합해 배포하고, 담임 교사는 이를 상담 내용과 함께 학급 생기부로 확정해 나이스에 직접 입력합니다.',['P4','R4','T2','T4','TN'],['k8','k9','k14','k15']],
 ['학생은 같은 참여 기록을 ‘내 활동’에 받아 돌아보며 담고, 그 기록은 다음 학기 ‘나를 알고’로 이어집니다.',['P4','S4','S1'],['k12','k13']],
 ['프로그램 담당 교사는 학생 후기와 교사 의견으로 개선안을 만들고, 승인을 거쳐 다음 해 교육계획에 반영합니다.',['P4','PI','P1'],['k16','k17']]
];
const PM=document.querySelector('.pmap'),SP=document.getElementById('sparks'),NS='http://www.w3.org/2000/svg';
const RM=matchMedia('(prefers-reduced-motion: reduce)');
let cur=-1,auto=null,raf=0;
function sparkAlong(paths){
  /* 지나간 길은 은은한 관으로 채워지고(제자리에 남음), 다 차면 안에서 빛 알갱이가 쉬지 않고 흘러요. 깜빡임 없음. */
  SP.getAnimations?.({subtree:true}).forEach(a=>a.cancel());SP.textContent='';if(!paths.length)return;
  let at=0;
  paths.forEach(p=>{const kind=p.classList.contains('fg')?'g':'a',d=p.getAttribute('d'),len=p.getTotalLength();
    const pipe=document.createElementNS(NS,'path'),run=document.createElementNS(NS,'path');
    pipe.setAttribute('class','pipe '+kind);run.setAttribute('class','run');pipe.setAttribute('d',d);run.setAttribute('d',d);
    SP.appendChild(pipe);SP.appendChild(run);
    if(RM.matches){run.classList.add('go');run.style.animation='none';return}
    const dur=Math.min(1500,520+len*3.2);
    pipe.style.strokeDasharray=len+' '+len;
    pipe.animate([{strokeDashoffset:len},{strokeDashoffset:0}],{duration:dur,delay:at,easing:'cubic-bezier(.45,.05,.3,1)',fill:'both'})
      .finished.then(()=>run.classList.add('go')).catch(()=>{});
    at+=dur*0.55;  /* 앞 줄이 반쯤 찼을 때 다음 줄이 이어서 — 끊기지 않게 */
  });
}
function step(i){
  cur=i;const [cap,boxes,arrows]=STEPS[i];
  PM.classList.add('playing');
  PM.querySelectorAll('.pbox,.arw,.alab').forEach(e=>e.classList.toggle('on',boxes.includes(e.dataset.k)||arrows.includes(e.dataset.k)));
  $('pl-cap').textContent=cap;$('pl-n').textContent=(i+1)+' / '+STEPS.length;
  $('pl-prev').disabled=i===0;$('pl-next').disabled=i===STEPS.length-1;$('pl-all').disabled=false;
  sparkAlong(arrows.map(k=>PM.querySelector('.arw[data-k="'+k+'"]')).filter(Boolean));
  const first=PM.querySelector('.pbox.on');const mb=document.querySelector('.mapbox');
  if(first&&mb.scrollWidth>mb.clientWidth){const r=first.getBoundingClientRect(),m=mb.getBoundingClientRect();mb.scrollBy({left:r.left-m.left-m.width/3,behavior:RM.matches?'auto':'smooth'})}
}
function stopAuto(){if(auto){clearInterval(auto);auto=null}$('pl-play').textContent=cur>=0?(cur===STEPS.length-1?'↻ 다시 보기':'▶ 이어 보기'):'▶ 흐름 보기'}
function playAll(){
  if(auto){stopAuto();return}
  document.querySelector('.mapbox').scrollIntoView({block:'start',behavior:RM.matches?'auto':'smooth'});
  if(cur<0||cur===STEPS.length-1)step(0);else step(cur+1);
  $('pl-play').textContent='⏸ 멈춤';
  auto=setInterval(()=>{if(cur>=STEPS.length-1){stopAuto();return}step(cur+1);if(cur===STEPS.length-1)setTimeout(stopAuto,10)},5200);
}
function allView(){stopAuto();cur=-1;SP.getAnimations?.({subtree:true}).forEach(a=>a.cancel());SP.textContent='';PM.classList.remove('playing');PM.querySelectorAll('.on').forEach(e=>e.classList.remove('on'));
  $('pl-cap').textContent='버튼을 누르면 한 학기 기록이 어떻게 오가는지 여덟 차례로 보여 줍니다.';$('pl-n').textContent='0 / '+STEPS.length;$('pl-prev').disabled=true;$('pl-next').disabled=false;$('pl-all').disabled=true;$('pl-play').textContent='▶ 흐름 보기'}
$('pl-play').onclick=playAll;
$('pl-next').onclick=()=>{stopAuto();step(Math.min(STEPS.length-1,cur+1));stopAuto()};
$('pl-prev').onclick=()=>{stopAuto();step(Math.max(0,cur-1));stopAuto()};
$('pl-all').onclick=allView;
$('playbar').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();$('pl-next').click()}else if(e.key==='ArrowLeft'){e.preventDefault();if(cur>0)$('pl-prev').click()}else if(e.key==='Escape'){allView()}});
</script>
